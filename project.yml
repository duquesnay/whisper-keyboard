name: WhisperKeyboard
options:
  bundleIdPrefix: com.guillaumeduquesnay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

targets:
  WhisperKeyboard:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumeduquesnay.whisper-keyboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: WhisperKeyboardExtension
      - package: WhisperKit

  WhisperKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    settings:
      base:
        INFOPLIST_FILE: Keyboard/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumeduquesnay.whisper-keyboard.keyboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: WhisperKit

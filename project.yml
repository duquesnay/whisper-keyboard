name: WhisperKeyboard
options:
  bundleIdPrefix: com.guillaumeduquesnay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit
    from: "10.0.0"

targets:
  WhisperKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumeduquesnay.whisper-keyboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ZG2N3GX4PM
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: App/WhisperKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.guillaumeduquesnay.whisper-keyboard
    dependencies:
      - target: WhisperKeyboardExtension
      - package: WhisperKit
      - package: KeyboardKit

  WhisperKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    settings:
      base:
        INFOPLIST_FILE: Keyboard/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumeduquesnay.whisper-keyboard.keyboard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ZG2N3GX4PM
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Keyboard/WhisperKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.guillaumeduquesnay.whisper-keyboard
    dependencies:
      - package: KeyboardKit
